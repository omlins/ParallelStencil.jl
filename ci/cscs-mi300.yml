include:
  - remote: 'https://gitlab.com/cscs-ci/recipes/-/raw/master/templates/v2/.ci-ext.yml'

# Pkg.test runs on the allocated node in the uenv, which provides ROCm (the uenv has no Julia: an x86 Julia build of the CI user is used):
# the GPU backends (AMDGPU, KernelAbstractions) run on a MI300A GPU and the CPU backends (Threads, Polyester, KernelAbstractions) on the
# EPYC CPU. JULIA_DEPOT_PATH: a job-local depot in front of a dedicated x86 CI depot, which the MI250 and MI300 jobs share and which jobs
# of different pipelines use at the same time: Julia keeps at most 10 precompile caches per package in the depot it writes to, evicting
# the oldest, which can be the one another job is loading. No core dumps are written on crashes (GBs).
.mi300:
  extends: .baremetal-runner-beverin-mi300
  variables:
    SLURM_JOB_NUM_NODES: 1
    SLURM_TIMELIMIT: '00:45:00'
    UENV: '56ebb909a6164680'                         # prgenv-gnu/7.2.3 (ROCm 7.2.3)
    JULIA: '/users/lraess/julia_amd/julia_amd-1.13'  # Same Julia version as GH200 (juliaup release channel).
    JULIA_AMDGPU_DISABLE_ARTIFACTS: '1'              # Use the ROCm of the uenv.
    JULIA_AMDGPU_CORE_MUST_LOAD: '1'
    JULIA_AMDGPU_HIP_MUST_LOAD: '1'
    JULIA_NUM_THREADS: 2
    PS_TEST_BACKEND: 'AMDGPU'          # The test runner installs AMDGPU into the test environment; fail instead of skipping the GPU tests if it is not functional.
    PS_TEST_AD: '0'                    # No Enzyme: the newest AMDGPU (2.9) and KernelAbstractions (0.10) require LLVM.jl 10, which Enzyme does not support yet; the tests of automatic differentiation on AMD GPUs run in the MI250 job (AMDGPU 2.8, KernelAbstractions 0.9).
    PS_TEST_FILES: ''                  # Test files to run (default: all).
  script:
    - ulimit -c 0
    - |
      uenv run $UENV --view=default -- env JULIA_DEPOT_PATH=$CI_PROJECT_DIR/.julia:$SCRATCH/.julia-ps-ci-beverin $JULIA --project --startup-file=no -e '
        using Pkg
        Pkg.instantiate()
        Pkg.test(; coverage=true, test_args=String.(split(get(ENV, "PS_TEST_FILES", ""))))'
    - |
      JULIA_DEPOT_PATH=$CI_PROJECT_DIR/.julia:$SCRATCH/.julia-ps-ci-beverin $JULIA --startup-file=no -e '
        using Pkg
        Pkg.activate(; temp=true)
        Pkg.add("CoverageTools")
        using CoverageTools
        LCOV.writefile("lcov.info", vcat(process_folder("src"), process_folder("ext")))'
    - bash ci/codecov_upload.sh mi300

mi300:
  extends: .mi300
