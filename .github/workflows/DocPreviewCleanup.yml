name: Doc Preview Cleanup
on:
  pull_request:
    types: [closed]
concurrency:
  group: doc-preview-cleanup
  cancel-in-progress: false
jobs:
  doc-preview-cleanup:
    if: github.repository_owner == 'omlins' # Previews are only deployed for pull requests from branches of this repository.
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push to the gh-pages branch.
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
      - name: Delete preview and history
        run: |
          git config user.name "Documenter.jl"
          git config user.email "documenter@juliadocs.github.io"
          git rm -rf --ignore-unmatch "previews/PR$PRNUM"
          git commit -m "delete preview" --allow-empty
          git branch gh-pages-new $(echo "delete history" | git commit-tree HEAD^{tree})
        env:
          PRNUM: ${{ github.event.number }}
      - name: Push changes
        run: git push --force origin gh-pages-new:gh-pages
