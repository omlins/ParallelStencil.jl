name: CI
on:
  push:
    branches:
      - main
    tags: '*'
    paths-ignore: &docs_only # Changes to the documentation only do not run the tests (the Documentation workflow builds and deploys the documentation).
      - 'docs/**'
      - 'README.md'
  pull_request:
    paths-ignore: *docs_only
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
permissions:
  actions: write  # Needed for julia-actions/cache to delete old caches.
  contents: read
env:
  JULIA_NUM_THREADS: 2
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.version == 'pre' }}
    env:
      PS_TEST_BACKEND: ${{ startsWith(matrix.os, 'macOS') && 'Metal' || '' }} # The macOS runners (Apple silicon) have a functional Metal GPU: the test runner installs Metal into the test environment and the Metal tests must run.
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'min' # Minimum supported version (from the Project.toml compat entry; minimum version supporting Data module creation)
          - '1'   # Latest stable 1.x release of Julia
        os:
          - ubuntu-latest
          - macOS-latest # NOTE: the architecture of the runner is used (aarch64), not x64 (Rosetta).
        include:
          - {version: 'pre', os: ubuntu-latest} # Upcoming Julia release (allowed to fail)
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          flags: cpu
          token: ${{ secrets.CODECOV_TOKEN }} # NOTE: for pull requests from forks, the upload is done tokenless.
          fail_ci_if_error: false
